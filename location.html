    <div id="registerModal" class="register-modal"> <div class="register-card"> <h2>Join Youth Chat</h2> <input id="username" placeholder="Enter your name"> <button onclick="registerUser()">Join Chat</button> </div> </div> <div class="chat-app">  <div class="chat-container"> <div class="chat-header"> <h2>St George Youth Community</h2> <div id="userDisplay"></div> </div> <div class="messages" id="messages">

</button>  <div class="emoji-btn" onclick="addEmoji()">😀</div> <input type="text" id="messageInput" placeholder="Type a message..."> <button onclick="sendMessage()"> Send </button> </div> </div> </div> <script>
    const API_URL =
"https://script.google.com/macros/s/AKfycbyZYHTOLVJyB6nuldLLTvLCXr03a2bbA0HgUidq96w9bp95x3y_qhKc1D8Wh2JwfaCjcQ/exec";

/* ==========================
GLOBALS
========================== */

let currentUser =
localStorage.getItem("chatUser") || "";

let members =
JSON.parse(
localStorage.getItem("members")
) || [];

let messages = [];

let mediaRecorder;
let chunks = [];

/* ==========================
USER REGISTRATION
========================== */

if(currentUser){
document
    .getElementById("registerModal")
    ?.classList.add("hidden");

const userDisplay =
    document.getElementById("userDisplay");

if(userDisplay){
    userDisplay.textContent =
        "👤 " + currentUser;
}

}

function registerUser(){
const username =
    document
    .getElementById("username")
    .value
    .trim();

if(!username) return;

currentUser = username;

localStorage.setItem(
    "chatUser",
    username
);

if(!members.includes(username)){

    members.push(username);

    localStorage.setItem(
        "members",
        JSON.stringify(members)
    );

}

document
    .getElementById("registerModal")
    ?.classList.add("hidden");

document
    .getElementById("userDisplay")
    .textContent =
    "👤 " + username;

renderMembers();

}

/* ==========================
MEMBERS
========================== */

function renderMembers(){
const container =
    document.getElementById("members");

if(!container) return;

container.innerHTML = "";

members.forEach(member => {

    container.innerHTML += 
        <div class="member">

            <div class="avatar">
                ${member.charAt(0).toUpperCase()}
            </div>

            <div>
                ${member}
            </div>

            <div class="status"></div>

        </div>
    ;

});

}

/* ==========================
LOAD MESSAGES
========================== */

async function loadMessages(){
try{

    const res =
        await fetch(
            API_URL +
            "?action=getMessages&roomId=general"
        );

    const data =
        await res.json();

    messages =
        data.messages || [];

    renderMessages();

}catch(err){

    console.error(
        "Load error:",
        err
    );

}

}

/* ==========================
SEND TEXT MESSAGE
========================== */

async function sendMessage(){

const input =
    document.getElementById(
        "messageInput"
    );

const text =
    input.value.trim();

if(!text || !currentUser)
    return;

try{

    await fetch(API_URL,{

        method:"POST",

        body:JSON.stringify({

            action:"sendMessage",

            name:currentUser,

            roomId:"general",

            type:"text",

            message:text

        })

    });

    input.value = "";

    loadMessages();

}catch(err){

    console.error(
        "Send error:",
        err
    );

}

}

/* ==========================
STICKERS
========================== */

function openStickerPicker(){

const stickers = [

    "😀",
    "❤️",
    "🙏",
    "🎉",
    "🔥",
    "👏",
    "🙌"

];

const sticker =
    prompt(
        "Choose Sticker:\n\n" +
        stickers.join(" ")
    );

if(!sticker) return;

sendSticker(sticker);

}

async function sendSticker(sticker){
try{

    await fetch(API_URL,{

        method:"POST",

        body:JSON.stringify({

            action:"sendMessage",

            name:currentUser,

            roomId:"general",

            type:"sticker",

            message:sticker

        })

    });

    loadMessages();

}catch(err){

    console.error(err);

}

}

/* ==========================
IMAGE UPLOAD
========================== */

async function uploadImage(){
const file =
    document
    .getElementById("imageInput")
    .files[0];

if(!file) return;

const reader =
    new FileReader();

reader.onload =
    async function(){

    try{

        await fetch(API_URL,{

            method:"POST",

            body:JSON.stringify({

                action:"uploadImage",

                file:reader.result,

                fileName:file.name,

                name:currentUser,

                roomId:"general"

            })

        });

        loadMessages();

    }catch(err){

        console.error(err);

    }

};

reader.readAsDataURL(file);

}

/* ==========================
VOICE NOTES
========================== */

async function toggleRecording(){
try{

    const stream =
        await navigator
        .mediaDevices
        .getUserMedia({
            audio:true
        });

    mediaRecorder =
        new MediaRecorder(
            stream
        );

    chunks = [];

    mediaRecorder.ondataavailable =
        e => {

        chunks.push(
            e.data
        );

    };

    mediaRecorder.onstop =
        async ()=>{

        const blob =
            new Blob(
                chunks,
                {
                    type:
                    "audio/webm"
                }
            );

        const reader =
            new FileReader();

        reader.onload =
            async ()=>{

            await fetch(
                API_URL,
                {

                method:"POST",

                body:
                JSON.stringify({

                    action:
                    "uploadAudio",

                    file:
                    reader.result,

                    fileName:
                    "voice.webm",

                    name:
                    currentUser,

                    roomId:
                    "general"

                })

            });

            loadMessages();

        };

        reader.readAsDataURL(
            blob
        );

    };

    mediaRecorder.start();

    setTimeout(()=>{

        mediaRecorder.stop();

    },10000);

}catch(err){

    console.error(err);

}

}

/* ==========================
RENDER MESSAGES
========================== */

function renderMessages(){

const container =
    document
    .getElementById(
        "messages"
    );

if(!container) return;

container.innerHTML = "";

messages.forEach(msg=>{

    const side =
        msg.name === currentUser
        ? "sent"
        : "received";

    let content = "";

    if(msg.type === "text"){

        content =
            msg.content;

    }

    else if(
        msg.type === "sticker"
    ){

        content = `
            <div class="sticker">
                ${msg.content}
            </div>
        `;

    }

    else if(
        msg.type === "image"
    ){

        content = 
            <img
            src="${msg.content}"
            class="chat-image">
        ;

    }

    else if(
        msg.type === "audio"
    ){

        content = 
            <audio
            controls
            class="voice-note">

                <source
                src="${msg.content}">

            </audio>
        ;

    }

    container.innerHTML += 

        <div class="message ${side}">

            <div class="message-name">
                ${msg.name}
            </div>

            ${content}

            <div class="time">

                ${new Date(
                    msg.timestamp
                ).toLocaleTimeString(
                    [],
                    {
                        hour:"2-digit",
                        minute:"2-digit"
                    }
                )}

            </div>

        </div>

    ;

});

container.scrollTop =
    container.scrollHeight;

}
